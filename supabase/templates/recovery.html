<div style="font-family: sans-serif; max-width: 520px; margin: 0 auto; padding: 32px 24px; color: #1F2D20;">

  <p style="font-size: 18px; font-weight: bold; margin: 0 0 8px;">
    パスワードの設定をお願いします
  </p>

  <p style="font-size: 14px; line-height: 1.8; color: #516251; margin: 0 0 24px;">
    ファミマネのパスワード設定リンクをお送りしました。<br>
    下のボタンをクリックして、パスワードを設定してください。
  </p>

  <a href="{{ .ConfirmationURL }}"
     style="display: inline-block; background-color: #4BAF57; color: #ffffff; text-decoration: none;
            font-size: 15px; font-weight: bold; padding: 14px 28px;
            border-radius: 999px; margin-bottom: 32px;">
    パスワードを設定する
  </a>

  <hr style="border: none; border-top: 1px solid #e0e0e0; margin: 24px 0;">

  <p style="font-size: 12px; line-height: 1.8; color: #7A8D7A; margin: 0 0 8px;">
    ボタンが開けない場合は、以下の URL をブラウザにコピーしてください。
  </p>
  <p style="font-size: 12px; word-break: break-all; color: #516251; margin: 0 0 24px;">
    {{ .ConfirmationURL }}
  </p>

  <p style="font-size: 12px; line-height: 1.8; color: #7A8D7A; margin: 0;">
    ※リンクの有効期限には制限があります。<br>
    ※このメールにお心当たりのない場合は、破棄してください。<br>
    ご自身でリクエストしていない場合、アカウントは変更されません。
  </p>

</div>
