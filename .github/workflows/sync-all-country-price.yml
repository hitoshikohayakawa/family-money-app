name: Sync MUFG Index Fund Prices

on:
  schedule:
    # 平日 8:00 JST (= 23:00 UTC 前日) に自動実行
    # eMAXIS Slim ファンドの基準価額は前営業日終値を使用するため翌朝取得で問題なし
    - cron: '0 23 * * 1-5'
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Run without writing to investment_asset_prices"
        required: false
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: sync-all-country-price
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      NOTIFICATION_EMAIL_FROM: ${{ secrets.NOTIFICATION_EMAIL_FROM }}
      PRICE_SYNC_ALERT_EMAIL: h.kohayakawa@petsallright.net
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Enable dry run for manual dispatch
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        run: echo "PRICE_SYNC_DRY_RUN=1" >> "$GITHUB_ENV"

      - name: Sync MUFG index fund prices (全世界・S&P500・TOPIX・新興国)
        run: npm run prices:sync:mufg-index

      - name: Verify latest synced prices
        if: ${{ github.event_name != 'workflow_dispatch' || !inputs.dry_run }}
        run: npm run prices:check:mufg-index

      - name: Send failure notification email
        if: ${{ failure() }}
        run: npm run prices:notify-failure
