name: Sync All-Country Price

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Run without writing to investment_asset_prices"
        required: false
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: sync-all-country-price
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      NOTIFICATION_EMAIL_FROM: ${{ secrets.NOTIFICATION_EMAIL_FROM }}
      PRICE_SYNC_ALERT_EMAIL: h.kohayakawa@petsallright.net
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Enable dry run for manual dispatch
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        run: echo "PRICE_SYNC_DRY_RUN=1" >> "$GITHUB_ENV"

      - name: Sync all-country price
        run: npm run prices:sync:all-country

      - name: Verify latest synced price
        if: ${{ github.event_name != 'workflow_dispatch' || !inputs.dry_run }}
        run: npm run prices:check:all-country

      - name: Send failure notification email
        if: ${{ failure() }}
        run: npm run prices:notify-failure
